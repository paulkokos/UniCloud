# Test Configuration for UniCloud Backend
# This configuration is used during test execution

# Use H2 in-memory database for unit tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=unicloud

# Initialize H2 schema
spring.sql.init.mode=always

# Disable security for tests (can be overridden in specific test classes)
spring.security.enabled=false

# JWT Configuration (test values)
jwt.secret=test-secret-key-for-testing-only-min-32-chars-long
jwt.expiration=3600

# Logging
logging.level.root=INFO
logging.level.com.unicloud=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Disable Actuator security
management.security.enabled=false
