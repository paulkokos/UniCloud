# Application Name
spring.application.name=UniCloud Backend

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/unicloud_dev
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=unicloud

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration
logging.level.root=INFO
logging.level.com.unicloud=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT Configuration (will be overridden by environment variables)
jwt.secret=${JWT_SECRET:dev-secret-key-for-testing-only}
jwt.expiration=${JWT_EXPIRATION:3600}

# OAuth Configuration (development defaults)
oauth.google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:mock-microsoft-client-id}
oauth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:mock-microsoft-client-secret}
oauth.icloud.client-id=${ICLOUD_CLIENT_ID:mock-icloud-client-id}
oauth.icloud.client-secret=${ICLOUD_CLIENT_SECRET:mock-icloud-client-secret}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Development Settings
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
