# Server Configuration
server.port=8080
spring.application.name=UniCloud

# Disable security auto-configuration for now
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# OAuth 2.0 Client Configuration for Microsoft
spring.security.oauth2.client.registration.microsoft.client-id=<your-client-id>
spring.security.oauth2.client.registration.microsoft.client-secret=<your-client-secret>
spring.security.oauth2.client.registration.microsoft.provider=microsoft
# Logging
logging.level.com.unicloudapp=DEBUG
logging.level.org.springframework.web=DEBUG
